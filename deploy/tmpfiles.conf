# The directories where the decoy and web containers create their sockets, recreated at every boot
# (/run is emptied). Each is owned by the containers' uid (10001, the Dockerfiles' USER) and open
# to nginx's group, www-data, only: nothing else on the host can reach the apps or name a visitor.
# Installed as /etc/tmpfiles.d/attenborough.conf (deploy/README.md).
d /run/attenborough 0755 root root -
d /run/attenborough/decoy 0750 10001 www-data -
d /run/attenborough/web 0750 10001 www-data -
# The reverse: nginx (root) listens here for the API, the only one in the containers' group 10001.
d /run/attenborough/google 0750 root 10001 -
