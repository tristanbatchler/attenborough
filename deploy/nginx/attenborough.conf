# Attenborough's nginx site: the decoy, which answers every name and the bare IP, and the exhibit.
# A template: deploy/README.md renders it with envsubst, filling in DECOY_DOMAIN, EXHIBIT_DOMAIN
# and TLS_CERTIFICATE_DIR from .env (nginx's own $variables are left alone), and installs it as
# /etc/nginx/sites-available/attenborough. The rendered file names the honeypot: never commit it.

# --- The decoy -------------------------------------------------------------------------------

# Per-address connection limit (decoy-proxy.conf).
limit_conn_zone $binary_remote_addr zone=attenborough_decoy:10m;

# Everything that matches no other site on this host: scanners that only know the IP, or a name
# that isn't served here. Its certificate names nothing, so a connection by IP learns nothing about
# the host's domains.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/attenborough/nameless.crt;
    ssl_certificate_key /etc/nginx/attenborough/nameless.key;

    include /etc/nginx/attenborough/decoy-proxy.conf;
}

# The decoy's own domain, with a real certificate. Plain HTTP is served too, not redirected: a
# scanner's http:// request is recorded as it was sent.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${DECOY_DOMAIN};

    ssl_certificate ${TLS_CERTIFICATE_DIR}/fullchain.pem;
    ssl_certificate_key ${TLS_CERTIFICATE_DIR}/privkey.pem;

    include /etc/nginx/attenborough/decoy-proxy.conf;
}

# --- The exhibit -----------------------------------------------------------------------------

# Only Cloudflare reaches the exhibit: anyone else asking this host for it gets no answer, so the
# exhibit can't be traced to this host by asking for it here. Cloudflare's published ranges, from
# https://www.cloudflare.com/ips/ (fetched 2026-10-01); update them when Cloudflare does.
geo $attenborough_from_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# Per reader: Cloudflare names the reader in CF-Connecting-IP, which can be trusted only because
# nothing but Cloudflare gets this far. A second guard on top of the API's bounded queries.
limit_req_zone $http_cf_connecting_ip zone=attenborough_exhibit:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name ${EXHIBIT_DOMAIN};
    server_tokens off;

    if ($attenborough_from_cloudflare = 0) {
        return 444;
    }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${EXHIBIT_DOMAIN};
    server_tokens off;

    ssl_certificate ${TLS_CERTIFICATE_DIR}/fullchain.pem;
    ssl_certificate_key ${TLS_CERTIFICATE_DIR}/privkey.pem;

    if ($attenborough_from_cloudflare = 0) {
        return 444;
    }

    limit_req zone=attenborough_exhibit burst=20 nodelay;
    limit_req_status 429;

    location / {
        proxy_pass http://unix:/run/attenborough/web/web.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
