# The decoy app behind nginx, included by both decoy server blocks in attenborough.conf. Installed
# as /etc/nginx/attenborough/decoy-proxy.conf (deploy/README.md).

# The decoy imitates a stock nginx, whose error pages name no version (decoy/src/lib/server/nginx.ts).
server_tokens off;
# The decoy app's BODY_SIZE_LIMIT (docker-compose.yml). A bigger body gets nginx's own 413, and the
# request is not recorded.
client_max_body_size 1m;
# At most this many connections at once from one address: a scanner gets every request answered,
# but can't tie up the host.
limit_conn attenborough_decoy 32;

# SvelteKit answers this one path itself, before the decoy app's hook could disguise it.
location ~ /__route\.js$ {
    return 404;
}

location / {
    proxy_pass http://unix:/run/attenborough/decoy/decoy.sock;
    # The Host header as the visitor sent it (with its port, or none at all), which is what the
    # decoy records. $host would normalise it.
    proxy_set_header Host $http_host;
    # Overwrite, never append: the visitor's own X-Forwarded-For never reaches the decoy app, which
    # takes the visitor's address from this header (ADDRESS_HEADER, XFF_DEPTH=1).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
