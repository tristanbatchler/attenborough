[project]
name = "attenborough"
version = "0.1.0"
description = "The backend for Attenborough"
readme = "README.md"
authors = [
    { name = "tristanbatchler", email = "info@tbat.me" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.5",
    "pytest>=9.1.1",
]

[project.scripts]
api = "attenborough:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "ruff>=0.16.4",
    "sqlc-bin>=1.31.1.post1",
]

[tool.ruff]
exclude = [
    # Generated by sqlc (src/attenborough/db/sqlc.yaml): never linted or type-checked.
    "src/attenborough/db/__init__.py",
    "src/attenborough/db/enums.py",
    "src/attenborough/db/models.py",
    "src/attenborough/db/queries.py",
]

[tool.basedpyright]
ignore = [
    # Generated by sqlc (src/attenborough/db/sqlc.yaml): never linted or type-checked.
    "src/attenborough/db/__init__.py",
    "src/attenborough/db/enums.py",
    "src/attenborough/db/models.py",
    "src/attenborough/db/queries.py",
]
typeCheckingMode = "all"


[tool.fastapi]
entrypoint = "attenborough.main:app"
